<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio project placeholder</title>
  <desc id="desc">A simple background placeholder for a project preview.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#grad)"/>
  <g stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.6">
    <path d="M80 560 C250 420, 320 420, 460 560 S700 620, 850 500 S1060 380, 1120 420"/>
    <path d="M80 200 L320 350 L500 180 L780 340 L1120 160"/>
  </g>
  <g fill="#dbeafe" font-family="Arial, sans-serif" font-size="52">
    <text x="520" y="380">Project Preview</text>
  </g>
</svg>
