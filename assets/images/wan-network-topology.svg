<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">WAN network architecture placeholder</title>
  <desc id="desc">A stylized network diagram with routers, VPN tunnels, and cloud services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08121d"/>
      <stop offset="100%" stop-color="#101f33"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="20" fill="url(#bg)"/>
  <g stroke="#1e3a5f" stroke-width="2" fill="none">
    <path d="M120 310 L260 210 L420 180 L590 250 L690 170" opacity="0.8"/>
    <path d="M260 210 L260 120 L420 120 L420 180" opacity="0.8"/>
    <path d="M590 250 L590 120 L690 120 L690 170" opacity="0.8"/>
  </g>
  <g fill="#0f172a" stroke="#67e8f9" stroke-width="2">
    <rect x="70" y="240" width="120" height="80" rx="14"/>
    <rect x="220" y="170" width="120" height="80" rx="14"/>
    <rect x="390" y="145" width="120" height="80" rx="14"/>
    <rect x="560" y="220" width="120" height="80" rx="14"/>
    <rect x="640" y="120" width="100" height="70" rx="14"/>
  </g>
  <g fill="url(#node)">
    <circle cx="130" cy="120" r="18"/>
    <circle cx="420" cy="60" r="18"/>
    <circle cx="660" cy="70" r="18"/>
  </g>
  <g fill="#dbeafe" font-family="Arial, sans-serif" font-size="18">
    <text x="96" y="287">Branch</text>
    <text x="246" y="215">Router</text>
    <text x="414" y="190">Core</text>
    <text x="585" y="265">Security</text>
    <text x="662" y="128">Cloud</text>
    <text x="105" y="150">User</text>
    <text x="403" y="75">Firewall</text>
    <text x="646" y="90">Services</text>
  </g>
</svg>
