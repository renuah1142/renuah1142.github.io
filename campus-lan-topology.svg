<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Campus LAN topology diagram</title>
  <desc id="desc">A stylized campus LAN layout with six buildings, a core, and ISP connections.</desc>
  <rect width="800" height="420" rx="8" fill="#10151b"/>
  <rect x="1" y="1" width="798" height="418" rx="8" fill="none" stroke="#263140"/>
  <g stroke="#263140" stroke-width="1.5" fill="none">
    <path d="M90 300 L200 300 L260 220 L380 220 L430 300 L540 300 L610 220 L710 220" opacity="0.9"/>
    <path d="M310 150 L310 300" opacity="0.9"/>
    <path d="M500 150 L500 300" opacity="0.9"/>
  </g>
  <g fill="#161d25" stroke="#c9752f" stroke-width="1.5">
    <rect x="50" y="250" width="90" height="70" rx="4"/>
    <rect x="170" y="250" width="90" height="70" rx="4"/>
    <rect x="290" y="250" width="90" height="70" rx="4"/>
    <rect x="410" y="250" width="90" height="70" rx="4"/>
    <rect x="530" y="250" width="90" height="70" rx="4"/>
    <rect x="650" y="250" width="90" height="70" rx="4"/>
    <rect x="350" y="120" width="120" height="70" rx="4"/>
  </g>
  <g fill="#e7ebef" font-family="IBM Plex Mono, monospace" font-size="15">
    <text x="58" y="288">B1</text>
    <text x="178" y="288">B2</text>
    <text x="298" y="288">B3</text>
    <text x="418" y="288">B4</text>
    <text x="538" y="288">B5</text>
    <text x="658" y="288">B6</text>
    <text x="377" y="159">Core</text>
  </g>
</svg>
