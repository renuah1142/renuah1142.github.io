<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">WAN network architecture diagram</title>
  <desc id="desc">A stylized network diagram with routers, VPN tunnels, and cloud services.</desc>
  <rect width="800" height="420" rx="8" fill="#10151b"/>
  <rect x="1" y="1" width="798" height="418" rx="8" fill="none" stroke="#263140"/>
  <g stroke="#263140" stroke-width="1.5" fill="none">
    <path d="M120 310 L260 210 L420 180 L590 250 L690 170" opacity="0.9"/>
    <path d="M260 210 L260 120 L420 120 L420 180" opacity="0.9"/>
    <path d="M590 250 L590 120 L690 120 L690 170" opacity="0.9"/>
  </g>
  <g fill="#161d25" stroke="#c9752f" stroke-width="1.5">
